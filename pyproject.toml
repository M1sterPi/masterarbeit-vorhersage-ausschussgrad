[project]
name = "masterarbeit-ausschussprognose"
version = "1.0.0"
description = "Skripte der Masterarbeit: Vorhersage und Erklärung des Ausschussgrads von Quarzglas-Billets aus Stamm- und Prozessdaten"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Exakt die Versionen, mit denen die Ergebnisse der Arbeit gerechnet wurden.
dependencies = [
    "numpy==1.26.1",
    "pandas==2.3.3",
    "scipy==1.15.3",
    "scikit-learn==1.7.2", # >= 1.6 nötig: GroupKFold(shuffle=True)
    "matplotlib==3.10.7",
    "xgboost==3.1.1",
    "catboost==1.2.8",
    "tabpfn==8.0.8",
    "tabpfn-extensions==0.4.2", # nur xai/05 (SHAP für TabPFN)
    "shapiq==1.7.0",            # von tabpfn-extensions genutzt
    "aeon==1.3.0",              # MiniRocket, HYDRA, FreshPRINCE
    "tsfresh==0.21.2",          # FreshPRINCE
    "optuna==4.5.0",            # Hyperparameter-Suche (tune.py)
    "influxdb-client==1.49.0",  # nur Datenexport (merge_billetv2.py, arc_end_scan.py)
    "python-dotenv==1.2.1",
    # TabPFN; Build für CUDA 13, läuft ohne Grafikkarte auf der CPU (langsamer)
    "torch==2.9.1",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
line-length = 100
